<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AURA — Skin, but softer.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: #f8f2ec;
      color: #332923;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================
       NAVBAR
    ========================= */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 20px 6%;
      background: rgba(248, 242, 236, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(51, 41, 35, 0.08);
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 28px;
      letter-spacing: 5px;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      font-size: 14px;
    }

    .nav-links a {
      position: relative;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 0;
      height: 1px;
      background: #332923;
      transition: 0.3s;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-icons {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 20px;
    }

    .cart-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      position: relative;
      font-size: 19px;
    }

    .cart-count {
      position: absolute;
      top: -9px;
      right: -9px;

      width: 17px;
      height: 17px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #332923;
      color: white;
      font-size: 10px;
    }

    .menu-btn {
      display: none;
      border: none;
      background: transparent;
      font-size: 23px;
      cursor: pointer;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;
      padding: 140px 6% 70px;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .hero-text {
      max-width: 580px;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 11px;
      margin-bottom: 22px;
      opacity: 0.65;
    }

    .hero h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(55px, 8vw, 100px);
      line-height: 0.98;
      font-weight: 400;
      margin-bottom: 30px;
    }

    .hero p {
      max-width: 430px;
      font-size: 16px;
      opacity: 0.72;
      margin-bottom: 35px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 14px 27px;

      border: 1px solid #332923;
      background: #332923;
      color: white;

      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 11px;

      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: transparent;
      color: #332923;
    }

    .hero-image {
      height: 650px;
      overflow: hidden;
      position: relative;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* =========================
       TRUST BAR
    ========================= */

    .trust-bar {
      border-top: 1px solid rgba(51, 41, 35, 0.1);
      border-bottom: 1px solid rgba(51, 41, 35, 0.1);

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      padding: 23px 6%;
      text-align: center;

      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 10px;
    }

    /* =========================
       INTRO
    ========================= */

    .intro {
      padding: 120px 6%;
      text-align: center;
    }

    .intro h2 {
      max-width: 850px;
      margin: auto;

      font-family: "Playfair Display", serif;
      font-weight: 400;
      font-size: clamp(38px, 5vw, 65px);
      line-height: 1.1;
    }

    .intro p {
      max-width: 570px;
      margin: 30px auto 0;
      opacity: 0.68;
    }

    /* =========================
       EDITORIAL
    ========================= */

    .editorial {
      padding: 0 6% 120px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;

      margin-bottom: 35px;
    }

    .section-heading h2 {
      font-family: "Playfair Display", serif;
      font-size: 42px;
      font-weight: 400;
    }

    .section-heading span {
      font-size: 12px;
      opacity: 0.6;
    }

    .editorial-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 20px;
    }

    .editorial-column {
      display: grid;
      gap: 20px;
    }

    .editorial-card {
      position: relative;
      overflow: hidden;
      min-height: 400px;
    }

    .editorial-card.tall {
      min-height: 820px;
    }

    .editorial-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.7s ease;
    }

    .editorial-card:hover img {
      transform: scale(1.04);
    }

    .editorial-overlay {
      position: absolute;
      left: 25px;
      bottom: 25px;

      background: rgba(248, 242, 236, 0.92);
      padding: 13px 18px;

      font-family: "Playfair Display", serif;
      font-size: 21px;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .products {
      padding: 100px 0 120px;
      background: #eee2d8;
    }

    .products-inner {
      padding: 0 6%;
    }

    .product-scroll {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding-bottom: 20px;

      scrollbar-width: none;
    }

    .product-scroll::-webkit-scrollbar {
      display: none;
    }

    .product-card {
      flex: 0 0 285px;
    }

    .product-image {
      height: 370px;
      overflow: hidden;
      background: #e2d4c8;
      margin-bottom: 17px;
    }

      height: 100%;
      object-fit: cover;
